
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    outputs:
      report_ready: ${{ steps.check_report.outputs.ready }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Executar testes
        id: run_tests
        continue-on-error: true
        run: npm test

      - name: Gerar resumo dos resultados
        if: ${{ always() }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const summary = process.env.GITHUB_STEP_SUMMARY;
          const jsonPath = 'test-results/results.json';

          let output = '# Resultado dos testes Playwright\n\n';

          if (!fs.existsSync(jsonPath)) {
            output += 'O arquivo JSON de resultados não foi encontrado.\n';
            fs.appendFileSync(summary, output);
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          const stats = report.stats || {};

          const passed = stats.expected ?? 0;
          const failed = stats.unexpected ?? 0;
          const skipped = stats.skipped ?? 0;
          const flaky = stats.flaky ?? 0;
          const total = passed + failed + skipped + flaky;
          const duration = ((stats.duration ?? 0) / 1000).toFixed(2);

          const rate = total
            ? ((passed / total) * 100).toFixed(1)
            : '0.0';

          output += '| Indicador | Resultado |\n';
          output += '|---|---:|\n';
          output += `| Total de testes | ${total} |\n`;
          output += `| Aprovados | ${passed} |\n`;
          output += `| Falhos | ${failed} |\n`;
          output += `| Ignorados | ${skipped} |\n`;
          output += `| Instáveis (flaky) | ${flaky} |\n`;
          output += `| Taxa de aprovação | ${rate}% |\n`;
          output += `| Duração | ${duration}s |\n`;

          fs.appendFileSync(summary, output);
          NODE

      - name: Salvar relatório HTML
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Salvar resultados JSON e evidências
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/results.json
            test-results/artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Verificar disponibilidade do relatório
        id: check_report
        if: ${{ always() }}
        run: |
          if [ -f playwright-report/index.html ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Manter pipeline vermelho em caso de falha
        if: ${{ always() && steps.run_tests.outcome == 'failure' }}
        run: exit 1

  deploy:
    needs: test
    if: >-
      always() &&
      needs.test.outputs.report_ready == 'true' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar relatório HTML
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar relatório
        id: deployment
        uses: actions/deploy-pages@v4